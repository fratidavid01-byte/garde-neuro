<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garde neuro">
<title>Garde neuro</title>
<meta name="theme-color" content="#2B3AD0">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">






<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one left-aligned column for a phone held in one hand. Home = time rail + tool list; a tool = items, with the result pinned at the bottom. */
:root{
  --paper:#ECEFF8; --surface:#FFFFFF; --ink:#121836; --muted:#59618A; --line:#D3D8EA;
  --accent:#2B3AD0; --on-accent:#FFFFFF; --tint:#E1E5FB;
  --ok:#0B7A63; --warn:#A86200; --crit:#C02A3C;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0A0E23; --surface:#131937; --ink:#E8EBFA; --muted:#99A1C8; --line:#272F58;
    --accent:#93A0FF; --on-accent:#0A0E23; --tint:#1C2450;
    --ok:#4FD1B5; --warn:#F2B34C; --crit:#FF7D8B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A0E23; --surface:#131937; --ink:#E8EBFA; --muted:#99A1C8; --line:#272F58;
  --accent:#93A0FF; --on-accent:#0A0E23; --tint:#1C2450;
  --ok:#4FD1B5; --warn:#F2B34C; --crit:#FF7D8B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:620px;margin:0 auto;padding:20px 16px 150px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:2.3rem;font-weight:800;line-height:1.02}
h2{font-size:1.2rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* Home */
.top{display:flex;flex-direction:column;gap:4px}
.chrono{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.chrono-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.elapsed{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.elapsed small{font-size:1.1rem;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:6px}
.onset{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.onset input{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:44px}
.rail{position:relative;height:14px;border-radius:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}
.rail i{border-radius:4px;background:var(--line)}
.rail i.on{background:var(--accent)}
.rail i.s1.on{background:var(--ok)} .rail i.s2.on{background:var(--warn)} .rail i.s3.on,.rail i.s4.on{background:var(--crit)}
.cursor{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.ticks{display:grid;grid-template-columns:repeat(4,1fr);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ticks span:last-child{display:flex;justify-content:space-between}
.windows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.windows li{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.windows b{font-weight:700;text-align:right}
.is-ok{color:var(--ok)} .is-warn{color:var(--warn)} .is-crit{color:var(--crit)}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;min-height:48px}
.group{display:flex;flex-direction:column;gap:8px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.list a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.list a:first-child{border-top:0}
.list a strong{font-weight:700}
.list a .d{grid-column:1;font-size:.86rem;color:var(--muted)}
.kind{grid-row:1/span 2;grid-column:2;font-size:.75rem;color:var(--accent);background:var(--tint);border-radius:999px;padding:3px 9px}
footer{font-size:.82rem;color:var(--muted)}

/* Tool */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-weight:600;min-height:44px}
.back::before{content:"";width:9px;height:9px;border-left:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg)}
.tool-head{display:flex;flex-direction:column;gap:6px}
.tool-head .line{display:flex;justify-content:space-between;align-items:center;gap:12px}
.items{display:flex;flex-direction:column;gap:14px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
legend{padding:0;font-weight:700;margin-bottom:6px}
legend small,.tog small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.opt,.tog{display:grid;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-height:50px}
.opt{grid-template-columns:34px 1fr}
.tog{grid-template-columns:1fr auto}
.opt .n,.tog .n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;text-align:center;border-radius:9px;background:var(--paper);padding:4px 0;min-width:34px}
.tog .n{padding:4px 9px}
.opt[aria-pressed="true"],.tog[aria-pressed="true"]{border-color:var(--accent);background:var(--tint)}
.opt[aria-pressed="true"] .n,.tog[aria-pressed="true"] .n{background:var(--accent);color:var(--on-accent)}
.field{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px}
.field label{font-weight:600}
.field label small{display:block;font-weight:400;color:var(--muted);font-size:.84rem}
.field input,.field select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px;text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:7px}
.card h2{font-size:1.05rem}
.note{font-size:.88rem;color:var(--muted)}
.out{font-size:.98rem}
.out ul{margin:6px 0 0;padding-left:1.1em}

.card a,.steps a,.note a{color:var(--accent);font-weight:600}
.steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps>li{counter-increment:st;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.steps h2{display:flex;gap:10px;align-items:baseline;font-size:1.08rem}
.steps h2::before{content:counter(st);font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}
.steps ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:7px}
.branch{display:flex;flex-direction:column;gap:3px;border-left:5px solid var(--line);background:var(--paper);border-radius:0 12px 12px 0;padding:10px 12px}
.branch.ok{border-color:var(--ok)} .branch.warn{border-color:var(--warn)} .branch.crit{border-color:var(--crit)}
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:15px 16px;text-decoration:none;font-weight:700}
.start span{white-space:nowrap;font-weight:400;font-size:.88rem;opacity:.9}

.fsec{display:flex;flex-direction:column;gap:10px}
.q{display:flex;flex-direction:column;gap:7px}
.ql{font-weight:600}.ql small{font-weight:400;color:var(--muted);font-size:.84rem;margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.linkrow{display:block;text-decoration:none;color:var(--accent);font-weight:600;text-align:center}
.preview{font-family:var(--body);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}

.mrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mrow .ql small{display:block;margin-left:0}
.side{display:grid;grid-template-columns:22px repeat(6,1fr);gap:6px;align-items:center}
.sl{font-family:var(--display);font-weight:700;color:var(--muted)}
.g{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;min-height:42px;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;padding:0}
.g[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
details.card summary{font-weight:700;cursor:pointer}

.sub{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-left:4px solid var(--accent);padding-left:10px}
.sub span{font-size:.92rem;font-weight:600}
.other{width:100%;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;min-height:46px}

.dot{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--gc);margin-right:9px}
.group .list{border-left:5px solid var(--gc)}
.gname{font-size:.86rem;font-weight:600;color:var(--muted);display:flex;align-items:center}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:2px;min-height:64px}
.quick b{font-family:var(--display);font-size:1.02rem;line-height:1.15}.quick span{font-size:.8rem;color:var(--muted)}
.card ul ul{margin-top:7px}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.badge{background:var(--crit);color:var(--surface);border-radius:999px;font-size:.75rem;font-weight:700;min-width:20px;padding:1px 6px;text-align:center;font-variant-numeric:tabular-nums}
.asbtn{border:0;font:inherit;cursor:pointer;width:100%;text-align:left}
button.back.asbtn{background:none;width:auto;padding:0}
.aslink{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.wide{width:100%}
.warnbox{border-left:5px solid var(--warn);background:var(--surface);border-radius:0 12px 12px 0;padding:10px 12px;font-size:.9rem}
.crumbs{display:flex;flex-direction:column;gap:6px}
.crumb{display:flex;flex-direction:column;gap:1px;text-align:left;background:none;border:0;border-left:3px solid var(--accent);padding:4px 0 4px 12px;min-height:44px;justify-content:center}
.crumb span{font-size:.8rem;color:var(--muted)}.crumb b{font-weight:600;font-size:.95rem}
.tq,.leaf{background:var(--surface);border:1.5px solid var(--accent);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.tq ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.tq a,.leaf a{color:var(--accent);font-weight:600}
.topt{width:100%;text-align:left;background:var(--tint);border:1.5px solid var(--tint);border-radius:14px;padding:13px 14px;min-height:52px;font-weight:600}
.topt:active{border-color:var(--accent)}
.leaf{border-width:0 0 0 6px;border-style:solid;border-color:var(--line);border-radius:6px 18px 18px 6px;gap:4px}
.leaf.ok{border-color:var(--ok)}.leaf.warn{border-color:var(--warn)}.leaf.crit{border-color:var(--crit)}
.leaf h2{font-size:1.35rem;line-height:1.15}
.elist{display:flex;flex-direction:column;gap:10px}
.ecard{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gc);border-radius:6px 16px 16px 6px;padding:12px 14px}
.ecard{padding:0;gap:0}
.eopen{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;padding:12px 14px 10px;font:inherit;color:inherit}
.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.st.tap{min-height:44px;font-size:.92rem;font-weight:600;background:var(--paper);color:var(--ink);border-width:1.5px;cursor:pointer}
.st.tap.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ecard.done .eopen{opacity:.6}
.ecard .d{font-size:.88rem;color:var(--muted)}
.eh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.86rem}
.eh b{font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.etype{display:inline-flex;align-items:center;color:var(--muted);font-weight:600}
.eurg{background:var(--crit);color:var(--surface);border-radius:999px;padding:1px 9px;font-weight:700;font-size:.78rem}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.st{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.st.on{background:var(--ok);border-color:var(--ok);color:var(--surface);font-weight:600}
.st.warn{border-color:var(--warn);color:var(--warn);font-weight:600}
.st.crit{background:var(--crit);border-color:var(--crit);color:var(--surface);font-weight:700}
.cf{display:flex;flex-direction:column;gap:5px;min-width:0}
.cf label,.cf .lab{font-weight:600;font-size:.92rem}
.cf input,.cf textarea,.addrow input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;font:inherit;color:inherit}
.cf textarea{resize:vertical;line-height:1.4}
.two{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:start}
.addrow{display:flex;gap:8px;align-items:center}.addrow input{flex:1;min-width:0}
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 10px;margin-bottom:6px}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--paper);padding:0;position:relative}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"]::after{content:"";position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid var(--surface);border-width:0 3px 3px 0;transform:rotate(45deg)}
.tdone{text-decoration:line-through;color:var(--muted)}
.chip.sm{min-height:38px;padding:6px 12px;font-size:.88rem}
.chip.danger{border-color:var(--crit);color:var(--crit);font-weight:700}
.chip .dot{width:9px;height:9px;margin-right:7px}
.chip[aria-pressed="true"] .dot{background:var(--on-accent)}

.minirow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.minirow .ghost{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;line-height:1.15}
.bkbtn small{font-weight:400;font-size:.76rem;color:var(--muted)}
.bkbtn.old{border-color:var(--warn)}.bkbtn.old small{color:var(--warn);font-weight:600}
details.restore summary{font-size:.88rem;color:var(--muted);cursor:pointer;padding:6px 0}
#cbk textarea,details.restore textarea,.fsec details textarea{width:100%;margin:8px 0;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:.85rem;color:inherit}
.ctime{display:flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);font-weight:600}
.ctime input{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;min-height:46px;font-variant-numeric:tabular-nums}
.nomage{grid-template-columns:1fr 96px}
textarea.bignotes{min-height:62vh;font-size:1.06rem;line-height:1.5}
.arow{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.arow input[data-an="l"]{grid-column:1/-1;border:0;min-height:36px;padding:2px 6px;font-weight:600}
.arow input{width:100%;min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;font:inherit;color:inherit}
.surv{display:flex;flex-direction:column;gap:3px;border-left:6px solid var(--line);background:var(--surface);border-radius:6px 14px 14px 6px;padding:12px 14px}
.surv.ok{border-color:var(--ok)}.surv.crit{border-color:var(--crit)}
.surv b{font-family:var(--display);font-size:1.25rem;line-height:1.15;font-variant-numeric:tabular-nums}
.sched{display:flex;flex-wrap:wrap;gap:6px 12px;font-variant-numeric:tabular-nums}
a.ghost{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.warnbox a{color:var(--accent);font-weight:600}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--tint);color:var(--accent)}
.ftchips .chip{min-height:40px;padding:7px 13px}
.fl{display:flex;flex-direction:column;align-items:stretch}
.fl-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.fl-head h2{font-size:1.5rem}
.fl ul{margin:6px 0 0;padding-left:1.05em;display:flex;flex-direction:column;gap:4px;font-size:.9rem;line-height:1.38}
.fl-step,.fl-q,.fl-end{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.fl-step{background:var(--surface);border:1px solid var(--line)}
.fl-q{background:var(--accent);color:var(--on-accent)}
.fl-q b{font-family:var(--display);font-size:1.02rem;line-height:1.2}
.fl-q .muted{color:var(--on-accent);opacity:.88}
.fl-q a{color:var(--on-accent);font-weight:700}
.fl-end{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px 12px 12px 6px}
.fl-end.ok{border-left-color:var(--ok)}.fl-end.warn{border-left-color:var(--warn)}.fl-end.crit{border-left-color:var(--crit)}
.fl-end b{font-family:var(--display);font-size:1rem;line-height:1.2}
.fl-brs{display:flex;flex-direction:column;gap:10px;margin:0 0 0 10px;padding:10px 0 2px 12px;border-left:2.5px solid var(--accent)}
.fl-br{display:flex;flex-direction:column;position:relative}
.fl-br::before{content:"";position:absolute;left:-12px;top:13px;width:10px;border-top:2.5px solid var(--accent)}
.fl-lab{align-self:flex-start;background:var(--tint);color:var(--accent);font-weight:700;font-size:.84rem;line-height:1.25;border-radius:8px;padding:4px 9px;margin-bottom:6px}
.fl-down{display:block;width:2.5px;height:14px;background:var(--line);margin:2px 0 2px 18px}
.fl-goto{align-self:flex-start;background:var(--surface);border:1.5px dashed var(--accent);color:var(--accent);font-weight:700;border-radius:12px;padding:9px 14px;min-height:44px}
.fl-links{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.86rem}

<script>
/* ---------- Données cliniques ---------- */
const yn=(l,p=1,h)=>({l,h,yn:1,o:[['Non',0],['Oui',p]]});
const mot=["0 pas de déficit","1 affaissement avant la fin, sans toucher le plan du lit","2 effort contre la pesanteur mais chute sur le plan du lit","3 pas d'effort contre la pesanteur","4 absence de mouvement"];
const limb=(l,h)=>({l,h,o:[...mot.map((m,i)=>[m[2].toUpperCase()+m.slice(3),i]),['Cotation impossible (amputation, arthrodèse)',0,'X']]});
const pct=(a,t)=>a[Math.min(t,a.length-1)];

const TOOLS=[
{id:'carnet',n:'Carnet de garde',d:'Les appels de la nuit, le suivi, les transmissions',type:'carnet'},
{id:'annuaire',n:'Annuaire de garde',d:'Les numéros utiles de la nuit',type:'annuaire'},
{id:'arbre',n:'Arbre AVC',d:"De l'appel à la décision, une question à la fois",type:'arbre'},
{id:'alerte',g:'alerte',n:'Alerte pas à pas',d:"Questions, gestes et décision, dans l'ordre",type:'ref',
 html:`<ol class="steps">
<li><h2>Dater le début</h2><ul><li>Heure précise du début. Sinon, dernière fois vu normal.</li><li>Constaté au réveil ? Heure du coucher, lever nocturne.</li><li>Un témoin joignable, avec son numéro.</li><li>Lancer le chrono sur la page d'accueil.</li></ul></li>
<li><h2>Les questions qui changent la décision</h2><ul><li><b>Anticoagulant</b> : lequel, quelle dose, heure de la dernière prise. Antiagrégant.</li><li>AVC, traumatisme crânien ou chirurgie dans les 3 derniers mois.</li><li>Antécédent d'hémorragie intracrânienne, saignement récent, cancer évolutif.</li><li>Crise convulsive au début. Céphalée brutale. Douleur thoracique ou dorsale.</li><li>Autonomie antérieure (<a href="#mrs">Rankin</a>), âge, <b>poids</b>.</li><li>Diabète, insuffisance rénale, grossesse ou accouchement récent.</li><li>Pacemaker ou autre contre-indication à l'IRM, allergie à l'iode.</li></ul></li>
<li><h2>Les gestes immédiats</h2><ul><li>Glycémie capillaire, pression artérielle aux deux bras, saturation, température.</li><li><a href="#nihss">NIHSS</a>, avec l'heure.</li><li>Deux voies veineuses, sérum physiologique, à jeun.</li><li>Bilan : NFS et plaquettes, TP et INR, TCA, ionogramme, créatinine, glycémie, troponine. Dosage spécifique si anticoagulant direct. β-hCG si besoin.</li><li>ECG, sans retarder l'imagerie.</li><li>Pas de sonde urinaire ni de geste invasif avant la décision.</li></ul></li>
<li><h2>L'imagerie, avec quatre réponses à obtenir</h2><ul><li>IRM (diffusion, FLAIR, T2*, TOF) ou scanner avec angioscanner du cou et du polygone.</li><li>Y a-t-il une hémorragie ?</li><li>Y a-t-il une occlusion proximale ? (<a href="#race">RACE</a> pour l'anticiper)</li><li>Quelle étendue ? (<a href="#aspects">ASPECTS</a>)</li><li>Si l'heure est inconnue : y a-t-il un mismatch diffusion-FLAIR ou de perfusion ?</li></ul></li>
<li><h2>La décision</h2>
<div class="branch crit"><b>Hémorragie</b><span>Pas de thrombolyse. <a href="#ta">pression sous 140/90</a>, <a href="#reversion">réversion</a> d'un anticoagulant, <a href="#ich">ICH score</a>, avis neurochirurgical.</span></div>
<div class="branch ok"><b>Ischémie de moins de 4 h 30, déficit invalidant</b><span>Vérifier les <a href="#thrombolyse">contre-indications</a>, ramener la pression <a href="#ta">sous 185/110</a>, puis thrombolyse : <a href="#dose">dose selon le poids</a>.</span></div>
<div class="branch ok"><b>Occlusion proximale</b><span>Appeler le neuroradiologue interventionnel : <a href="#thrombectomie">thrombectomie</a>, en plus de la thrombolyse si elle est possible, jusqu'à 24 h sur sélection.</span></div>
<div class="branch warn"><b>Heure inconnue, ou entre 4 h 30 et 9 h</b><span>Thrombolyse possible si l'imagerie montre un <a href="#thrombectomie">mismatch</a>.</span></div>
<div class="branch"><b>Déficit mineur non invalidant, ou AIT</b><span>Pas de thrombolyse. <a href="#abcd2">ABCD2</a> et <a href="#dapt">bithérapie antiplaquettaire</a>.</span></div></li>
<li><h2>Après la thrombolyse</h2><ul><li>NIHSS et pression artérielle toutes les 15 minutes pendant 2 h, toutes les 30 minutes pendant 6 h, puis toutes les heures jusqu'à 24 h.</li><li>Pression <a href="#ta">sous 180/105</a>.</li><li>Aucun antithrombotique ni geste invasif pendant 24 h.</li><li>Imagerie de contrôle à 24 h, avant de débuter l'antiagrégant.</li><li>Aggravation, céphalée ou vomissements : arrêt de la perfusion et imagerie en urgence.</li><li>Surveiller la langue et les lèvres : risque d'angio-œdème, surtout sous IEC.</li></ul></li>
</ol><a class="start" href="#entree">Rédiger le mot d'entrée<span>à cocher</span></a><p class="note">Trame de travail à valider avec le neurologue de garde et le protocole du service.</p>`},
{id:'entree',g:'alerte',n:"Mot d'entrée",d:'Coche les réponses, le mot se rédige tout seul',type:'form'},
{id:'nihss',g:'alerte',n:'NIHSS',d:'Gravité du déficit, de 0 à 42',type:'score',max:42,
 items:[
  {l:'Vigilance',o:[['Normale, réactions vives',0],['Obnubilation, éveil adapté aux stimulations nociceptives',1],['Coma, réponse adaptée aux stimulations nociceptives',2],['Coma grave, réponse stéréotypée ou aucune réponse motrice',3]]},
  {l:'Orientation',h:'Mois et âge',o:[['Deux réponses exactes',0],['Une réponse exacte',1],['Aucune réponse exacte',2]]},
  {l:'Commandes',h:'Ouverture des yeux, du poing',o:[['Deux ordres effectués',0],['Un ordre effectué',1],['Aucun ordre effectué',2]]},
  {l:'Oculomotricité',o:[['Normale',0],['Ophtalmoplégie partielle ou déviation réductible du regard',1],['Ophtalmoplégie horizontale complète ou déviation forcée du regard',2]]},
  {l:'Champ visuel',o:[['Normal',0],['Quadranopsie latérale homonyme, hémianopsie incomplète ou négligence visuelle unilatérale',1],['Hémianopsie latérale homonyme franche',2],['Cécité bilatérale ou coma',3]]},
  {l:'Paralysie faciale',o:[['Normale',0],['Asymétrie modérée, paralysie faciale unilatérale incomplète',1],['Paralysie faciale centrale unilatérale franche',2],['Paralysie faciale périphérique ou diplégie faciale',3]]},
  limb('Motricité du membre supérieur gauche','Bras tendu 10 secondes'),
  limb('Motricité du membre supérieur droit','Bras tendu 10 secondes'),
  limb('Motricité du membre inférieur gauche','Jambe tendue 5 secondes'),
  limb('Motricité du membre inférieur droit','Jambe tendue 5 secondes'),
  {l:'Ataxie',o:[['Absente',0],['Un membre',1],['Deux membres ou plus',2]]},
  {l:'Sensibilité',o:[['Normale',0],['Hypoesthésie minime à modérée',1],['Hypoesthésie sévère ou anesthésie',2]]},
  {l:'Langage',o:[["Pas d'aphasie",0],['Aphasie discrète à modérée',1],['Aphasie sévère',2],['Mutisme, aphasie totale',3]]},
  {l:'Dysarthrie',o:[['Normale',0],['Discrète à modérée',1],['Sévère',2],['Cotation impossible (intubation)',0,'X']]},
  {l:'Extinction, négligence',o:[['Absente',0],['Extinction dans une seule modalité ou négligence partielle',1],["Négligence sévère, anosognosie ou extinction dans plus d'une modalité",2]]}
 ],
 interp:t=>t===0?['Pas de déficit coté','ok']:t<=4?['AVC mineur','ok']:t<=15?['AVC modéré','warn']:t<=20?['AVC modéré à sévère','crit']:['AVC sévère','crit'],
 copy:(t,s,tot)=>'NIHSS à '+tot+' :\n'+t.items.map((it,i)=>'- '+it.l+(it.h&&!/secondes/.test(it.h)?' ('+it.h.toLowerCase()+')':'')+' : '+(it.o[s[i]][2]||it.o[s[i]][1])).join('\n')},

{id:'dn4',g:'lit',n:'DN4',d:'Douleur neuropathique, 10 questions',type:'score',max:10,
 items:[
  yn('Brûlure',1,'Interrogatoire : la douleur a-t-elle ce caractère ?'),
  yn('Sensation de froid douloureux'),
  yn('Décharges électriques'),
  yn('Fourmillements',1,'Interrogatoire : symptôme associé, dans la même zone'),
  yn('Picotements'),
  yn('Engourdissement'),
  yn('Démangeaisons'),
  yn('Hypoesthésie au tact',1,'Examen, dans la zone douloureuse'),
  yn('Hypoesthésie à la piqûre'),
  yn('Douleur provoquée ou augmentée par le frottement')
 ],
 interp:t=>t>=4?['En faveur d\'une douleur neuropathique','warn']:['Pas en faveur d\'une douleur neuropathique','ok'],
 note:"Bouhassira, 2005. Score de 4 ou plus sur 10 : en faveur d'une douleur neuropathique (sensibilité 83 %, spécificité 90 %). Les 7 questions d'interrogatoire seules (DN4-interview) se lisent avec un seuil de 3 sur 7."},

{id:'garches',n:'Score de Garches',d:'Score moteur de la myasthénie, sur 100',type:'calc',
 inputs:[
  {id:'bras',l:'Bras tendus à l\'horizontale (Barré)',u:'secondes',h:'1 point par 10 secondes, maximum 15 points à 150 secondes'},
  {id:'jambes',l:'Jambes tenues, couché sur le dos (Mingazzini)',u:'secondes',h:'Cuisses et jambes à 90°. 1 point par 5 secondes, maximum 15 points à 75 secondes'},
  {id:'tete',l:'Flexion de la tête, couché sur le dos',sel:[['10','Contre résistance (10)'],['5','Sans résistance (5)'],['0','Impossible (0)']]},
  {id:'assis',l:'Passage de couché à assis',sel:[['10','Sans l\'aide des mains (10)'],['5','Avec l\'aide des mains (5)'],['0','Impossible (0)']]},
  {id:'oculo',l:'Oculomotricité extrinsèque',sel:[['10','Normale (10)'],['5','Ptosis isolé (5)'],['0','Diplopie (0)']]},
  {id:'occl',l:'Occlusion palpébrale',sel:[['10','Complète (10)'],['5','Incomplète, cornée recouverte (5)'],['0','Incomplète, cornée découverte (0)']]},
  {id:'mast',l:'Mastication',sel:[['10','Normale (10)'],['5','Faible (5)'],['0','Impossible (0)']]},
  {id:'degl',l:'Déglutition',sel:[['10','Normale (10)'],['5','Gênée, sans fausse route (5)'],['0','Fausses routes (0)']]},
  {id:'phon',l:'Phonation',sel:[['10','Voix normale (10)'],['5','Voix nasonnée (5)'],['0','Aphonie ou voix inintelligible (0)']]}],
 fn:v=>{ const K=['tete','assis','oculo','occl','mast','degl','phon'];
  if(!(v.bras>=0&&v.jambes>=0&&K.every(k=>Number.isFinite(v[k])))) return null;
  const b=Math.min(15,Math.floor(v.bras/10)), j=Math.min(15,Math.floor(v.jambes/5)), t=b+j+K.reduce((a,k)=>a+v[k],0);
  const det='bras '+b+'/15, jambes '+j+'/15, tête '+v.tete+', couché-assis '+v.assis+', oculomotricité '+v.oculo+', occlusion '+v.occl+', mastication '+v.mast+', déglutition '+v.degl+', phonation '+v.phon;
  return {v:t+'/100',t:'Bras '+b+'/15, jambes '+j+'/15',lvl:t===100?'ok':v.degl===0||v.phon===0?'crit':'warn',copy:'Score de Garches : '+t+'/100 ('+det+')'}; },
 note:"Gajdos, 1983. 100 = force normale. Il n'y a pas de seuil diagnostique : on suit l'évolution d'un examen à l'autre. Fausses routes, troubles de la phonation ou dyspnée : chercher une crise myasthénique (capacité vitale, avis réanimation)."},

{id:'mgadl',n:'MG-ADL',d:'Retentissement de la myasthénie au quotidien, sur 24',type:'score',max:24,
 items:[
  {l:'Parole',o:[['Normale',0],['Voix nasonnée ou mal articulée par moments',1],['Voix nasonnée ou mal articulée en permanence, mais compréhensible',2],['Difficile à comprendre',3]]},
  {l:'Mastication',o:[['Normale',0],['Fatigue avec les aliments solides',1],['Fatigue avec les aliments mous',2],['Sonde gastrique',3]]},
  {l:'Déglutition',o:[['Normale',0],['Fausses routes rares',1],['Fausses routes fréquentes, alimentation adaptée',2],['Sonde gastrique',3]]},
  {l:'Respiration',o:[['Normale',0],["Essoufflement à l'effort",1],['Essoufflement au repos',2],['Ventilation mécanique',3]]},
  {l:'Se brosser les dents ou se coiffer',o:[['Aucune gêne',0],['Effort supplémentaire, sans pause',1],['Pauses nécessaires',2],["Impossible pour l'une des deux",3]]},
  {l:"Se lever d'une chaise",o:[['Aucune gêne',0],["Gêne légère, s'aide parfois des bras",1],["Gêne modérée, s'aide toujours des bras",2],["Gêne sévère, a besoin d'aide",3]]},
  {l:'Vision double',o:[['Jamais',0],['Parfois, pas tous les jours',1],['Tous les jours, pas en permanence',2],['En permanence',3]]},
  {l:'Chute de la paupière',o:[['Jamais',0],['Parfois, pas tous les jours',1],['Tous les jours, pas en permanence',2],['En permanence',3]]}
 ],
 interp:t=>t===0?['Pas de symptôme myasthénique','ok']:['À comparer au score précédent','warn'],
 note:"Wolfe, 1999. Questionnaire rempli avec le patient, sur ses symptômes récents. Une baisse de 2 points ou plus est considérée comme une amélioration significative. Respiration ou déglutition cotées 2 ou 3 : penser à la crise myasthénique."},

{id:'egris',n:'EGRIS',d:'Risque de ventilation dans le Guillain-Barré, de 0 à 7',type:'score',max:7,
 items:[
  {l:"Délai entre le début du déficit et l'admission",o:[['Plus de 7 jours',0],['4 à 7 jours',1],['3 jours ou moins',2]]},
  {l:"Atteinte faciale ou bulbaire à l'admission",o:[['Absente',0],['Présente',1]]},
  {l:"Score MRC somme à l'admission",h:'Sur 60, voir le testing moteur',o:[['51 à 60',0],['41 à 50',1],['31 à 40',2],['21 à 30',3],['20 ou moins',4]]}
 ],
 interp:t=>t<=2?['Risque faible de ventilation dans la semaine','ok']:t<=4?['Risque intermédiaire','warn']:['Risque élevé de ventilation dans la semaine','crit'],
 note:"Walgaard, 2010 ; validé dans la cohorte internationale IGOS (2022). Le risque estimé de ventilation dans la première semaine va de 1 % à 90 % selon le score. Surveiller la capacité vitale : règle des 20/30/40 (capacité vitale < 20 mL/kg, pression inspiratoire maximale > −30 cmH2O, pression expiratoire maximale < 40 cmH2O)."},

{id:'hughes',n:'Handicap du Guillain-Barré',d:'Échelle de Hughes, de 0 à 6',type:'score',max:6,
 items:[{l:'Niveau fonctionnel',o:[['Pas de symptôme',0],['Symptômes mineurs, capable de courir',1],['Marche 10 mètres sans aide, ne peut pas courir',2],['Marche 10 mètres avec une aide (canne, déambulateur, soutien)',3],['Alité ou au fauteuil',4],['Ventilation assistée, au moins une partie de la journée',5],['Décès',6]]}],
 interp:t=>t<=2?['Marche seul','ok']:t<=4?['Ne marche pas seul','warn']:['Atteinte respiratoire ou décès','crit'],
 note:"Hughes, 1978 (GBS disability score). Il sert à suivre l'évolution et entre dans les scores pronostiques du Guillain-Barré."},

{id:'four',n:'Score FOUR',d:'Coma, y compris chez le patient intubé, de 0 à 16',type:'score',max:16,
 items:[
  {l:'Réponse oculaire',o:[["Paupières ouvertes ou ouvertes sur ordre, suit du regard ou cligne sur ordre",4],['Paupières ouvertes, ne suit pas du regard',3],['Paupières fermées, ouverture à la voix forte',2],['Paupières fermées, ouverture à la douleur',1],['Paupières fermées malgré la douleur',0]]},
  {l:'Réponse motrice',o:[['Fait un signe sur ordre : pouce levé, poing, signe de paix',4],['Localise la douleur',3],['Flexion à la douleur',2],['Extension à la douleur',1],['Aucune réponse à la douleur, ou état de mal myoclonique',0]]},
  {l:'Réflexes du tronc cérébral',o:[['Réflexes photomoteurs et cornéens présents',4],['Une pupille dilatée et aréactive',3],['Réflexes photomoteurs ou cornéens absents',2],['Réflexes photomoteurs et cornéens absents',1],['Réflexes photomoteurs, cornéens et de toux absents',0]]},
  {l:'Respiration',o:[['Non intubé, respiration régulière',4],['Non intubé, respiration de Cheyne-Stokes',3],['Non intubé, respiration irrégulière',2],['Intubé, respire au-dessus de la fréquence du respirateur',1],['Respire à la fréquence du respirateur, ou apnée',0]]}
 ],
 interp:t=>t===16?['Pas de trouble de conscience coté','ok']:t===0?['Score nul : toutes les réponses abolies','crit']:['Trouble de conscience : suivre l\'évolution','warn'],
 note:"Wijdicks, 2005. Contrairement au Glasgow, il se cote chez le patient intubé et repère le syndrome d'enfermement (le patient suit du regard ou cligne sur ordre). Un score de 0 fait discuter une mort encéphalique."},

{id:'4at',n:'4AT',d:'Dépistage rapide du syndrome confusionnel, sur 12',type:'score',max:12,
 items:[
  {l:'Vigilance',h:"Observer le patient pendant l'évaluation",o:[["Normale, ou somnolence légère de moins de 10 secondes au réveil",0],['Nettement anormale : somnolence marquée ou agitation',4]]},
  {l:'AMT4',h:'Âge, date de naissance, lieu, année en cours',o:[['Aucune erreur',0],['Une erreur',1],['Deux erreurs ou plus, ou non testable',2]]},
  {l:'Attention',h:"Les mois de l'année à l'envers, à partir de décembre",o:[['7 mois ou plus sans erreur',0],["Commence mais moins de 7 mois, ou refuse",1],['Non testable : trop somnolent ou inattentif pour commencer',2]]},
  {l:'Changement aigu ou évolution fluctuante',h:"Vigilance, cognition, autre fonction mentale : apparu dans les 2 dernières semaines et encore présent dans les 24 dernières heures",o:[['Non',0],['Oui',4]]}
 ],
 interp:t=>t>=4?['Syndrome confusionnel possible','crit']:t>=1?['Trouble cognitif possible','warn']:['Confusion ou trouble cognitif sévère peu probables','ok'],
 note:"MacLullich, the4AT.com. Moins de 2 minutes, sans formation. Un score de 4 ou plus n'est pas un diagnostic : il impose un examen clinique et la recherche d'une cause. Tenir compte d'une aphasie ou d'une surdité."},

{id:'stess',n:'STESS',d:"Pronostic de l'état de mal épileptique, de 0 à 6",type:'score',max:6,
 items:[
  {l:'Conscience',o:[['Vigilant ou somnolent',0],['Stuporeux ou comateux',1]]},
  {l:'Type de crise le plus grave',o:[['Crise focale, absence ou myoclonies',0],['Crise généralisée convulsive',1],['État de mal non convulsif dans le coma',2]]},
  {l:'Âge',o:[['Moins de 65 ans',0],['65 ans ou plus',2]]},
  {l:'Antécédent de crises',o:[['Oui',0],['Non ou inconnu',1]]}
 ],
 interp:t=>t>=3?['Pronostic défavorable : mortalité hospitalière plus élevée','crit']:['Pronostic plus favorable','ok'],
 note:"Rossetti, 2008. Valable pour l'état de mal non anoxique. Un score de 0 à 2 a une très bonne valeur prédictive de survie ; à partir de 3, le risque de décès est nettement plus élevé. Il ne change pas le traitement d'urgence : voir la fiche état de mal."},

{id:'hunthess',n:'Hunt et Hess',d:"Gravité clinique de l'hémorragie méningée, grades I à V",type:'score',max:5,
 items:[{l:'État clinique',o:[['Asymptomatique, ou céphalée minime et raideur de nuque légère',1],['Céphalée modérée à sévère, raideur de nuque, pas de déficit sauf atteinte d\'un nerf crânien',2],['Somnolence, confusion ou déficit focal léger',3],['Stupeur, hémiparésie modérée à sévère, rigidité de décérébration débutante possible',4],['Coma profond, rigidité de décérébration, aspect moribond',5]],d:-1}],
 verdict:s=>{ const g=['I','II','III','IV','V'][s[0]]; return s[0]<=1?['Grade '+g+' : bon grade clinique','ok']:s[0]===2?['Grade '+g+' : grade intermédiaire','warn']:['Grade '+g+' : mauvais grade clinique','crit']; },
 note:"Hunt et Hess, 1968. On ajoute classiquement un grade en cas de maladie systémique grave (HTA, diabète, athérome sévère, BPCO) ou de vasospasme à l'angiographie. La WFNS et le Fisher modifié sont dans la fiche hémorragie méningée."},

{id:'spetzler',n:'Spetzler-Martin',d:'Risque chirurgical d\'une malformation artério-veineuse, grades I à V',type:'score',max:5,
 items:[
  {l:'Taille du nidus',h:'Plus grand diamètre en angiographie',d:-1,o:[['Moins de 3 cm',1],['3 à 6 cm',2],['Plus de 6 cm',3]]},
  {l:'Zone éloquente adjacente',h:'Cortex sensitivo-moteur, du langage ou visuel, thalamus, hypothalamus, capsule interne, tronc cérébral, pédoncules et noyaux du cervelet',o:[['Non',0],['Oui',1]]},
  {l:'Drainage veineux',o:[['Superficiel uniquement',0],['Profond',1]]}
 ],
 verdict:s=>{ const t=[1,2,3][s[0]]+s[1]+s[2], g=['I','II','III','IV','V'][t-1]; return t<=2?['Grade '+g+' : risque chirurgical faible','ok']:t===3?['Grade '+g+' : risque intermédiaire','warn']:['Grade '+g+' : risque chirurgical élevé','crit']; },
 note:"Spetzler et Martin, 1986. Le grade est la somme des points. Il estime le risque de la chirurgie, pas celui de l'embolisation ou de la radiochirurgie. Le grade VI désigne une malformation inopérable."},

{id:'epworth',n:"Échelle d'Epworth",d:'Somnolence diurne, sur 24',type:'score',max:24,
 items:[
  'Assis en train de lire','En regardant la télévision','Assis, inactif, dans un lieu public (cinéma, réunion)',"Passager d'une voiture roulant sans arrêt pendant une heure","Allongé l'après-midi quand les circonstances le permettent",'Assis en parlant avec quelqu\'un','Assis au calme après un repas sans alcool','Au volant, arrêté quelques minutes dans un embouteillage'
 ].map(l=>({l,o:[['Ne somnolerait jamais',0],['Faible chance de s\'endormir',1],['Chance moyenne',2],['Forte chance',3]]})),
 interp:t=>t<=10?['Pas de somnolence diurne excessive','ok']:t<=15?['Somnolence diurne excessive','warn']:['Somnolence diurne sévère','crit'],
 note:"Johns, 1991. Le patient estime ses chances de s'assoupir dans chaque situation, dans la vie récente. Normal jusqu'à 10 ; 11 ou plus : somnolence excessive."},

{id:'thrombolyse',g:'alerte',n:'Contre-indications à la thrombolyse',d:'Liste à cocher avant le bolus',type:'score',unit:'cochée(s)',
 items:[
  yn("Hémorragie intracrânienne à l'imagerie"),
  yn('Début des symptômes au-delà de 4 h 30 ou heure inconnue',1,"Sauf sélection par imagerie (mismatch)"),
  yn('Déficit mineur non invalidant ou en régression rapide'),
  yn("Suspicion d'hémorragie méningée"),
  yn('Pression artérielle au-dessus de 185/110 malgré traitement'),
  yn('Glycémie inférieure à 0,5 g/L ou supérieure à 4 g/L'),
  yn('Plaquettes inférieures à 100 000/mm³'),
  yn('AVK avec INR supérieur à 1,7',1,"Seuil des recommandations ; le RCP de l'altéplase retient 1,3"),
  yn('Anticoagulant oral direct pris depuis moins de 48 h',1,'Sauf dosage négligeable ou réversion (dabigatran)'),
  yn('Héparine à dose curative dans les 24 h',1,'Avec TCA allongé pour une héparine non fractionnée'),
  yn('AVC ischémique ou traumatisme crânien sévère depuis moins de 3 mois'),
  yn("Antécédent d'hémorragie intracrânienne"),
  yn('Chirurgie majeure ou traumatisme majeur dans les 14 jours'),
  yn('Hémorragie digestive ou urinaire dans les 21 jours, ou saignement actif'),
  yn('Tumeur intracrânienne, malformation artérioveineuse ou anévrisme'),
  yn('Endocardite, péricardite ou dissection aortique'),
  yn("Ponction lombaire ou ponction d'un vaisseau non compressible dans les 7 jours"),
  yn('Crise convulsive au début',1,"Possible si le déficit n'est pas post-critique"),
  yn('Hépatopathie sévère, accouchement récent, massage cardiaque traumatique ou prolongé')
 ],
 interp:t=>t===0?['Aucune contre-indication cochée','ok']:['À discuter avec le neurologue avant tout bolus','crit'],
 note:"Aide à la vérification, tirée du RCP de l'altéplase et des recommandations. Plusieurs contre-indications sont relatives : la décision se prend avec le neurologue."},

{id:'dose',g:'alerte',n:'Dose de thrombolytique',d:'Altéplase et ténectéplase selon le poids',type:'calc',
 inputs:[{id:'p',l:'Poids',u:'kg'}],
 fn:v=>{ if(!(v.p>=30&&v.p<=250)) return null;
  const r=x=>(Math.round(x*10)/10).toString().replace('.',',');
  const a=Math.min(0.9*v.p,90), tn=Math.min(0.25*v.p,25);
  return {v:r(tn)+' mg',t:'ténectéplase, ou altéplase '+r(a)+' mg',
   html:`<ul><li><b>Ténectéplase 0,25 mg/kg</b> (maximum 25 mg) : <b>${r(tn)} mg</b> en bolus intraveineux unique.</li><li><b>Altéplase 0,9 mg/kg</b> (maximum 90 mg) : <b>${r(a)} mg</b> au total, dont <b>${r(a*0.1)} mg</b> en bolus sur 1 minute puis <b>${r(a*0.9)} mg</b> sur 60 minutes.</li></ul>`,
   copy:`Poids ${r(v.p)} kg. Ténectéplase 0,25 mg/kg : ${r(tn)} mg en bolus. Altéplase 0,9 mg/kg : ${r(a)} mg (bolus ${r(a*0.1)} mg puis ${r(a*0.9)} mg sur 60 min).`}; },
 note:"Doses de l'AVC ischémique (ESO 2023, HAS 2024). Ne pas utiliser la dose de l'infarctus du myocarde."},

{id:'ta',g:'alerte',n:'Objectifs tensionnels',d:'Avant et après reperfusion, hématome',type:'ref',
 html:`<div class="card"><h2>Infarctus cérébral</h2><ul><li>Avant thrombolyse : en dessous de <b>185/110</b>.</li><li>Pendant et 24 h après thrombolyse : en dessous de <b>180/105</b>.</li><li>Après thrombectomie : en dessous de <b>180/105</b>, sans baisse intensive.</li><li>Sans reperfusion : respecter jusqu'à <b>220/120</b>. Au-delà, baisse prudente d'environ 15 % sur 24 h.</li></ul></div><div class="card"><h2>Hématome intracérébral</h2><ul><li>Objectif retenu dans le service : en dessous de <b>140/90</b>, à atteindre rapidement et à maintenir stable.</li></ul></div><p class="note">ESO 2021, AHA/ASA 2022. À adapter au protocole du service.</p>`},

{id:'thrombectomie',g:'alerte',n:'Thrombectomie et fenêtres tardives',d:"Critères, AVC du réveil",type:'ref',
 html:`<div class="card"><h2>Moins de 6 heures</h2><ul><li>Occlusion proximale de la circulation antérieure : carotide interne, M1 (M2 proximale à discuter).</li><li>Déficit invalidant, habituellement NIHSS à 6 ou plus.</li><li>ASPECTS à 6 ou plus.</li><li>En plus de la thrombolyse si elle est possible, sans retarder le geste.</li></ul></div><div class="card"><h2>De 6 à 24 heures</h2><ul><li>Sélection par imagerie : mismatch clinico-radiologique ou de perfusion (critères DAWN et DEFUSE-3).</li><li>Tronc basilaire : jusqu'à 24 h, NIHSS à 10 ou plus dans les essais.</li><li>Infarctus étendu (ASPECTS 3 à 5) : bénéfice montré dans les essais récents, à discuter avec le neuroradiologue.</li></ul></div><div class="card"><h2>AVC du réveil ou d'heure inconnue</h2><ul><li>Thrombolyse si mismatch diffusion-FLAIR à l'IRM.</li><li>Ou mismatch de perfusion entre 4 h 30 et 9 h.</li></ul></div><p class="note">ESO 2019, 2021 et 2023.</p>`},

{id:'befast',g:'reco',n:'BE-FAST',d:"Reconnaître un AVC en six lettres",type:'ref',
 html:`<div class="card"><ul><li><b>B</b>alance : trouble brutal de l'équilibre ou de la marche.</li><li><b>E</b>yes : baisse de vision, diplopie, amputation du champ visuel.</li><li><b>F</b>ace : asymétrie du visage.</li><li><b>A</b>rm : faiblesse d'un bras ou d'une jambe.</li><li><b>S</b>peech : trouble de la parole ou du langage.</li><li><b>T</b>ime : heure de début ou de dernière fois vu normal, puis alerte.</li></ul></div><p class="note">Glycémie capillaire d'abord : l'hypoglycémie est le premier diagnostic différentiel à écarter.</p>`},

{id:'rosier',g:'reco',n:'ROSIER',d:'AVC ou diagnostic différentiel, de -2 à 5',type:'score',
 items:[yn('Perte de connaissance ou syncope',-1),yn('Crise convulsive',-1),yn('Asymétrie faciale',1,'Signe nouveau, de début brutal'),yn("Faiblesse asymétrique d'un bras"),yn("Faiblesse asymétrique d'une jambe"),yn('Trouble de la parole'),yn('Déficit du champ visuel')],
 interp:t=>t>0?['AVC probable','crit']:['AVC peu probable, mais pas exclu','ok'],
 note:"Corriger d'abord une hypoglycémie puis réévaluer."},

{id:'race',g:'reco',n:'RACE',d:'Occlusion de gros vaisseau, de 0 à 9',type:'score',max:9,
 items:[
  {l:'Paralysie faciale',o:[['Absente',0],['Légère',1],['Modérée à sévère',2]]},
  {l:'Motricité du bras',h:'10 secondes',o:[['Normale ou légère dérive',0],['Modérée : lève le bras mais ne tient pas 10 secondes',1],['Sévère : ne lève pas contre la pesanteur',2]]},
  {l:'Motricité de la jambe',h:'5 secondes',o:[['Normale ou légère dérive',0],['Modérée : lève la jambe mais ne tient pas 5 secondes',1],['Sévère : ne lève pas contre la pesanteur',2]]},
  {l:'Déviation de la tête et des yeux',o:[['Absente',0],['Présente',1]]},
  {l:'Aphasie ou agnosie',h:"Hémiparésie droite : deux ordres (fermer les yeux, serrer le poing). Hémiparésie gauche : reconnaît-il son bras et son déficit ?",o:[['Deux réponses correctes',0],['Une seule réponse correcte',1],['Aucune réponse correcte',2]]}
 ],
 interp:t=>t>=5?['Occlusion de gros vaisseau probable','crit']:['Occlusion de gros vaisseau moins probable','ok']},

{id:'hints',g:'reco',n:'HINTS plus',d:'Vertige aigu continu avec nystagmus',type:'score',unit:'signe(s) central(aux)',
 items:[
  {l:'Head impulse test',o:[['Anormal : saccade de rattrapage',0],['Normal : pas de saccade',1]]},
  {l:'Nystagmus',o:[['Horizontal, unidirectionnel',0],['Changeant de direction, vertical ou torsionnel pur',1]]},
  {l:'Test of skew',h:"Test de l'écran alterné",o:[['Pas de déviation verticale',0],['Déviation verticale',1]]},
  {l:'Audition (le « plus »)',h:'Frottement des doigts de chaque côté',o:[['Pas de surdité nouvelle',0],['Surdité brutale du côté du vertige',1]]}
 ],
 interp:t=>t===0?['Profil périphérique : les quatre signes sont rassurants','ok']:['Au moins un signe central : origine centrale à éliminer','crit'],
 note:"Valable seulement pour un syndrome vestibulaire aigu continu, avec nystagmus présent au moment de l'examen. Une surdité brutale associée peut traduire une ischémie de l'artère cérébelleuse antéro-inférieure."},

{id:'abcd2',g:'ait',n:'ABCD2',d:"Risque d'AVC après un AIT, de 0 à 7",type:'score',max:7,
 items:[
  yn('Âge de 60 ans ou plus'),
  yn('Pression artérielle à 140/90 ou plus',1,'Systolique ≥ 140 ou diastolique ≥ 90'),
  {l:'Clinique',h:'Une seule réponse : la plus élevée qui s\'applique',d:-1,o:[['Autre symptôme isolé : sensitif, visuel, vertige, trouble de la marche',0],['Trouble de la parole sans déficit moteur',1],['Déficit moteur unilatéral',2]]},
  {l:'Durée des symptômes',d:-1,o:[['Moins de 10 minutes',0],['De 10 à 59 minutes',1],['60 minutes ou plus',2]]},
  yn('Diabète')
 ],
 interp:t=>t<=3?["Risque faible : environ 1 % d'AVC à 2 jours",'ok']:t<=5?["Risque modéré : environ 4 % d'AVC à 2 jours",'warn']:["Risque élevé : environ 8 % d'AVC à 2 jours",'crit'],
 note:"Un score bas ne dispense pas du bilan en urgence. Score à 4 ou plus : AIT à haut risque."},

{id:'dapt',g:'ait',n:'Bithérapie antiplaquettaire',d:'AIT à haut risque et AVC mineur',type:'ref',
 html:`<div class="card"><h2>Pour qui</h2><ul><li>AVC ischémique mineur (NIHSS à 3 ou moins) ou AIT à haut risque (ABCD2 à 4 ou plus).</li><li>Mécanisme non cardio-embolique, pas de thrombolyse.</li></ul></div><div class="card"><h2>Comment</h2><ul><li>Début dans les 24 h.</li><li>Aspirine : charge de <b>160 à 300 mg</b> le premier jour (trame du service : ASPEGIC 250 mg IV), puis 75 mg par jour.</li><li>Clopidogrel : charge de <b>300 mg</b> le premier jour, puis 75 mg par jour.</li><li>Durée : <b>21 jours</b>, puis un seul antiagrégant.</li></ul></div><div class="card"><h2>Variante</h2><ul><li>Aspirine et ticagrélor pendant 30 jours, jusqu'à NIHSS 5.</li></ul></div><p class="note">ESO 2021, essais CHANCE, POINT et THALES.</p>`},

{id:'ich',g:'hema',n:'ICH score',d:"Gravité d'un hématome, de 0 à 6",type:'score',max:6,
 items:[
  {l:'Score de Glasgow',o:[['13 à 15',0],['5 à 12',1],['3 ou 4',2]]},
  yn("Volume de l'hématome de 30 mL ou plus"),
  yn('Hémorragie intraventriculaire'),
  yn('Origine sous-tentorielle'),
  yn('Âge de 80 ans ou plus')
 ],
 interp:t=>['Mortalité à 30 jours dans la cohorte initiale : '+pct([0,13,26,72,97,100,100],t)+' %',t<=1?'ok':t===2?'warn':'crit'],

{id:'abc2',g:'hema',n:"Volume de l'hématome",d:'Méthode ABC/2',type:'calc',
 inputs:[{id:'a',l:'A',h:'Plus grand diamètre',u:'cm'},{id:'b',l:'B',h:'Diamètre perpendiculaire',u:'cm'},{id:'c',l:'C',h:'Hauteur : nombre de coupes × épaisseur',u:'cm'}],
 fn:v=>{ if(!(v.a>0&&v.b>0&&v.c>0)) return null; const x=v.a*v.b*v.c/2, s=(Math.round(x*10)/10).toString().replace('.',',');
  return {v:s+' mL',t:x>=30?'30 mL ou plus : 1 point au ICH score':'Moins de 30 mL',lvl:x>=30?'crit':'ok',copy:"Volume de l'hématome (ABC/2) : "+s+' mL'}; }},

{id:'glasgow',g:'hema',n:'Score de Glasgow',d:'De 3 à 15',type:'score',max:15,
 items:[
  {l:'Ouverture des yeux',o:[['Spontanée',4],['À la demande',3],['À la douleur',2],['Aucune',1]]},
  {l:'Réponse verbale',o:[['Orientée',5],['Confuse',4],['Mots inappropriés',3],['Sons incompréhensibles',2],['Aucune',1]]},
  {l:'Réponse motrice',o:[['Obéit aux ordres',6],['Orientée à la douleur',5],['Évitement',4],['Flexion stéréotypée',3],['Extension stéréotypée',2],['Aucune',1]]}
 ],
 interp:t=>t<=8?['Coma : protection des voies aériennes à discuter','crit']:t<=12?['Altération modérée de la vigilance','warn']:['Vigilance conservée ou peu altérée','ok'],
 copy:(t,s,tot)=>'Glasgow '+tot+' (Y'+t.items[0].o[s[0]][1]+' V'+t.items[1].o[s[1]][1]+' M'+t.items[2].o[s[2]][1]+')'},

{id:'reversion',g:'hema',n:'Réversion des anticoagulants',d:'Hématome sous AVK ou anticoagulant direct',type:'ref',
 html:`<div class="card"><h2>AVK</h2><ul><li>Concentré de complexe prothrombinique (PPSB) <b>25 UI/kg</b> et vitamine K <b>10 mg</b>, sans attendre l'INR.</li><li>Objectif : INR à 1,2 ou moins. Contrôle à 30 minutes, complément si besoin.</li></ul></div><div class="card"><h2>Dabigatran</h2><ul><li>Idarucizumab <b>5 g</b> (deux doses de 2,5 g).</li><li>S'il manque : PPSB 50 UI/kg.</li></ul></div><div class="card"><h2>Apixaban, rivaroxaban, édoxaban</h2><ul><li>PPSB <b>50 UI/kg</b>.</li><li>Pas de réversion si la concentration est à 30 ng/mL ou moins.</li><li>Andexanet selon la disponibilité locale.</li></ul></div><div class="card"><h2>Autres</h2><ul><li>Héparine : protamine, dose selon l'héparine reçue.</li><li>Antiagrégants : pas de transfusion plaquettaire hors neurochirurgie.</li></ul></div><p class="note">Recommandations françaises 2024 sur les hémorragies sous anticoagulants, ESO 2019.</p>`},

{id:'chadsvasc',n:'CHA2DS2-VA',d:'Risque embolique, de 0 à 8 (sans le sexe depuis 2024)',type:'score',max:8,
 items:[
  yn('Insuffisance cardiaque'),yn('Hypertension artérielle'),
  {l:'Âge',d:-1,o:[['Moins de 65 ans',0],['De 65 à 74 ans',1],['75 ans ou plus',2]]},

  yn('Maladie vasculaire',1,'Infarctus du myocarde, artériopathie, plaque aortique')
 ],

{id:'hasbled',g:'fa',n:'HAS-BLED',d:'Risque hémorragique, de 0 à 9',type:'score',max:9,
 items:[
  yn('Hypertension non contrôlée',1,'Systolique au-dessus de 160'),
  yn('Insuffisance rénale',1,'Dialyse, greffe ou créatinine au-dessus de 200 µmol/L'),
  yn('Insuffisance hépatique',1,'Cirrhose, ou bilirubine > 2 N associée à transaminases ou PAL > 3 N'),

{id:'reprise',g:'fa',n:"Reprise de l'anticoagulation",d:'Après un infarctus sur fibrillation atriale',type:'ref',
 html:`<div class="card"><h2>Délai selon la taille de l'infarctus</h2><ul><li>AIT : d'emblée.</li><li>Infarctus mineur ou modéré : dans les <b>48 heures</b>.</li><li>Infarctus étendu : à <b>J6 ou J7</b>.</li></ul></div><div class="card"><h2>Avant de débuter</h2><ul><li>Imagerie de contrôle pour écarter une transformation hémorragique si l'infarctus est étendu.</li><li>Anticoagulant oral direct de préférence, dose adaptée à la fonction rénale.</li></ul></div><p class="note">Schéma précoce de l'essai ELAN. La méta-analyse CATALYST (2025) est en faveur d'un début dans les 4 jours. À valider avec le senior.</p>`},

{id:'cockcroft',g:'fa',n:'Clairance de Cockcroft',d:'Avec les seuils des anticoagulants directs',type:'calc',
 inputs:[{id:'age',l:'Âge',u:'ans'},{id:'p',l:'Poids',u:'kg'},{id:'cr',l:'Créatinine',u:'µmol/L'},{id:'sx',l:'Sexe',sel:[['1.23','Homme'],['1.04','Femme']]}],
 fn:v=>{ if(!(v.age>0&&v.p>0&&v.cr>0&&v.sx>0)) return null;
  const c=(140-v.age)*v.p*v.sx/v.cr, r=Math.round(c);
  const k=(v.age>=80)+(v.p<=60)+(v.cr>=133);
  const api=r<15?'non recommandé':(k>=2||r<30)?'2,5 mg deux fois par jour':'5 mg deux fois par jour';
  const riv=r<15?'non recommandé':r<50?'15 mg par jour':'20 mg par jour';
  const edo=r<15?'non recommandé':(r<=50||v.p<=60)?'30 mg par jour':'60 mg par jour';
  const dab=r<30?'contre-indiqué':v.age>=80?'110 mg deux fois par jour':'150 mg deux fois par jour';
  return {v:r+' mL/min',t:r<30?'Insuffisance rénale sévère':r<50?'Insuffisance rénale modérée':'Pas de réduction liée au rein seul',lvl:r<30?'crit':r<50?'warn':'ok',
   html:`<ul><li>Apixaban : <b>${api}</b> (${k} critère(s) sur 3 : âge ≥ 80 ans, poids ≤ 60 kg, créatinine ≥ 133 µmol/L).</li><li>Rivaroxaban : <b>${riv}</b>.</li><li>Édoxaban : <b>${edo}</b> (30 mg si clairance de 15 à 50 ou poids ≤ 60 kg).</li><li>Dabigatran : <b>${dab}</b> (110 mg aussi sous vérapamil).</li></ul>`,
   copy:'Clairance de Cockcroft : '+r+' mL/min'}; },
 note:"Doses de la fibrillation atriale non valvulaire, d'après les RCP."},

{id:'rope',g:'usinv',n:'Score RoPE',d:'Foramen ovale perméable, de 0 à 10',type:'score',max:10,

 note:"Pour un infarctus cryptogénique avec foramen ovale perméable. Score à 7 ou plus : lien probable."},

{id:'ascod',g:'usinv',n:'ASCOD',d:'Classer la cause de l\'infarctus',type:'ref',
 html:`<div class="card"><h2>Cinq lettres</h2><ul><li><b>A</b> : athérosclérose.</li><li><b>S</b> : maladie des petites artères.</li><li><b>C</b> : cardiopathie emboligène.</li><li><b>O</b> : autre cause.</li><li><b>D</b> : dissection.</li></ul></div><div class="card"><h2>Un grade par lettre</h2><ul><li><b>1</b> : cause potentielle de l'infarctus.</li><li><b>2</b> : lien de causalité incertain.</li><li><b>3</b> : maladie présente, lien peu probable.</li><li><b>0</b> : maladie absente.</li><li><b>9</b> : bilan insuffisant pour conclure.</li></ul></div><p class="note">Exemple : A1 S0 C3 O0 D0.</p>`},

{id:'mrs',g:'usinv',n:'Rankin modifié',d:'Handicap, de 0 à 6',type:'score',max:6,
 items:[{l:'Niveau',d:-1,o:[['Aucun symptôme',0],['Symptômes sans incapacité : activités habituelles conservées',1],['Incapacité légère : autonome, mais ne fait plus toutes ses activités antérieures',2],['Incapacité modérée : a besoin d\'aide, marche seul',3],['Incapacité modérément sévère : ne marche pas seul, aide pour les soins du corps',4],['Incapacité sévère : alité, incontinent, soins constants',5],['Décès',6]]}],
 interp:t=>t<=2?['Autonome','ok']:t<=3?['Dépendance modérée','warn']:['Dépendance sévère','crit'],

{id:'mrc',g:'usinv',n:'Testing moteur MRC',d:'Muscle par muscle, droite et gauche, de 0 à 5',type:'mrc'},

{id:'aspects',g:'alerte',n:'ASPECTS',d:'Étendue de l\'ischémie sylvienne, de 10 à 0',type:'score',base:10,max:10,
 items:['Noyau caudé','Noyau lenticulaire','Capsule interne','Insula','M1 : cortex sylvien antérieur','M2 : cortex sylvien latéral','M3 : cortex sylvien postérieur','M4 : au-dessus de M1','M5 : au-dessus de M2','M6 : au-dessus de M3'].map(x=>yn(x,-1)),
